
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SMARTLOGI{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --azul: #5688b8;
            --azul-oscuro: #355f8b;
            --azul-claro: #edf3fa;
            --fondo: #f5f6f8;
            --texto: #344054;
            --secundario: #84909e;
            --borde: #e5e9ef;
            --blanco: #fff;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--fondo);
            color: var(--texto);
        }

        /* ESTRUCTURA: MENÚ A LA IZQUIERDA */

        .app-layout {
            display: grid;
            grid-template-columns: 205px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            padding: 22px 13px;
            background: var(--blanco);
            border-right: 1px solid var(--borde);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 8px;
            color: var(--azul-oscuro);
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
        }

        .logo-icono {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 9px;
            background: var(--azul-claro);
            font-size: 19px;
        }

        .logo-texto {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .logo-texto small {
            color: var(--secundario);
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1.3px;
        }

        .menu-titulo {
            padding: 0 10px;
            margin-bottom: 9px;
            color: #9aa4b2;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 10px;
            border-radius: 8px;
            color: #667386;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s, color .2s;
        }

        .menu a:hover {
            background: #f4f6f9;
            color: var(--azul-oscuro);
        }

        .menu a.activo {
            background: var(--azul-claro);
            color: var(--azul-oscuro);
            box-shadow: inset 3px 0 0 var(--azul);
        }

        /* CONTENIDO Y BARRA SUPERIOR */

        .contenido {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .barra-superior {
            min-height: 57px;
            padding: 13px 25px;
            background: var(--blanco);
            border-bottom: 1px solid var(--borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .barra-superior strong {
            color: #344054;
            font-size: 14px;
        }

        .estado-sistema {
            padding: 7px 10px;
            border: 1px solid var(--borde);
            border-radius: 8px;
            background: #fafbfc;
            color: #697586;
            font-size: 11px;
            white-space: nowrap;
        }

        .estado-sistema .punto {
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 5px;
            border-radius: 50%;
            background: var(--azul);
        }

        main {
            width: 100%;
            max-width: 1600px;
            min-width: 0;
            flex: 1;
            margin: 0 auto;
            padding: 24px;
        }

        h1 {
            color: var(--texto);
        }

        /* TARJETAS DE LAS DEMÁS SECCIONES */

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
            min-width: 0;
        }

        .card {
            min-width: 0;
            padding: 20px;
            border: 1px solid var(--borde);
            border-radius: 11px;
            background: var(--blanco);
            box-shadow: 0 2px 8px rgba(30, 50, 75, .035);
        }

        .card h3 {
            margin-top: 0;
            color: var(--texto);
        }

        .card p {
            overflow-wrap: anywhere;
        }

        .estado {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 12px;
        }

        /* TABLAS */

        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--borde);
            border-radius: 10px;
            background: var(--blanco);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--blanco);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #edf0f4;
            font-size: 13px;
        }

        th {
            background: #edf3fa;
            color: #425a73;
            font-weight: 700;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        /* BÚSQUEDA Y FORMULARIOS */

        .buscador {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;
            border: 1px solid #dce2ea;
            border-radius: 8px;
            background: white;
            color: var(--texto);
            font-size: 14px;
            outline: none;
        }

        input,
        select,
        textarea,
        button {
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #86a9ce;
            box-shadow: 0 0 0 3px rgba(71, 121, 168, .1);
        }

        img,
        canvas {
            max-width: 100%;
        }

        button,
        input[type="submit"] {
            cursor: pointer;
        }

        footer {
            padding: 17px;
            border-top: 1px solid var(--borde);
            background: white;
            color: #929cab;
            text-align: center;
            font-size: 11px;
        }

        /* TABLET */

        @media (max-width: 1000px) {
            .app-layout {
                grid-template-columns: 175px minmax(0, 1fr);
            }

            .sidebar {
                padding: 20px 9px;
            }

            .logo {
                font-size: 17px;
                padding: 0 4px;
            }

            .menu a {
                gap: 7px;
                padding: 10px 8px;
                font-size: 11px;
            }

            main {
                padding: 19px;
            }

            .barra-superior {
                padding: 13px 19px;
            }
        }

        /* CELULAR */

        @media (max-width: 650px) {
            .app-layout {
                display: flex;
                flex-direction: column;
            }

            .sidebar {
                position: relative;
                top: auto;
                height: auto;
                padding: 13px 12px 9px;
                gap: 13px;
                border-right: none;
                border-bottom: 1px solid var(--borde);
                overflow: visible;
            }

            .logo {
                font-size: 19px;
                padding: 0 3px;
            }

            .menu-titulo {
                display: none;
            }

            .sidebar > div:last-child {
                min-width: 0;
            }

            .menu {
                flex-direction: row;
                gap: 5px;
                padding: 2px 0 7px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .menu a {
                flex-shrink: 0;
                padding: 9px 11px;
                font-size: 11px;
            }

            .barra-superior {
                min-height: 49px;
                padding: 11px 13px;
            }

            .barra-superior strong {
                font-size: 12px;
            }

            .estado-sistema {
                padding: 6px 8px;
                font-size: 10px;
            }

            main {
                padding: 17px 12px;
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 11px;
            }

            .card {
                padding: 14px;
            }

            table {
                min-width: 600px;
            }
        }

        @media (max-width: 380px) {
            .cards {
                grid-template-columns: minmax(0, 1fr);
            }

            .estado-sistema {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="app-layout">

        <aside class="sidebar">

            <a class="logo" href="/">
                <span class="logo-icono">🚚</span>
                <span class="logo-texto">
                    SMARTLOGI
                    <small>GESTIÓN DE FLOTA</small>
                </span>
            </a>

            <div>
                <div class="menu-titulo">MENÚ PRINCIPAL</div>

                <nav class="menu">
                    <a href="/" class="{% if request.path == '/' %}activo{% endif %}">
                        📊 Dashboard
                    </a>

                    <a href="/pedidos" class="{% if request.path == '/pedidos' %}activo{% endif %}">
                        📦 Pedidos
                    </a>

                    <a href="/vehiculos" class="{% if request.path == '/vehiculos' %}activo{% endif %}">
                        🚚 Vehículos
                    </a>

                    <a href="/conductores" class="{% if request.path == '/conductores' %}activo{% endif %}">
                        👨‍✈️ Conductores
                    </a>

                    <a href="/rutas" class="{% if request.path == '/rutas' %}activo{% endif %}">
                        🗺️ Rutas
                    </a>

                    <a href="/mantenciones" class="{% if request.path == '/mantenciones' %}activo{% endif %}">
                        🔧 Mantenciones
                    </a>

                    <a href="/combustible" class="{% if request.path == '/combustible' %}activo{% endif %}">
                        ⛽ Combustible
                    </a>

                    <a href="/incidentes" class="{% if request.path == '/incidentes' %}activo{% endif %}">
                        🚨 Incidentes
                    </a>
                </nav>
            </div>

        </aside>

        <div class="contenido">

            <header class="barra-superior">
                <strong>Panel de gestión de flota</strong>

                <span class="estado-sistema">
                    <span class="punto"></span>
                    Sistema SMARTLOGI
                </span>
            </header>

            <main>
                {% block content %}
                {% endblock %}
            </main>

            <footer>
                SMARTLOGI · Gestión inteligente de flota
            </footer>

        </div>
    </div>
</body>
</html>
